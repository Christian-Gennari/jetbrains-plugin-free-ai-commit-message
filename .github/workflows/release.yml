name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only; skip publishing to JetBrains Marketplace'
        type: boolean
        default: false

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # A tag that disagrees with gradle.properties would publish the wrong
      # version (or fail confusingly after a long build), so fail fast.
      - name: Verify tag matches pluginVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -E '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG} pluginVersion=${VERSION}"
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pluginVersion ${VERSION}. Bump gradle.properties or fix the tag."
            exit 1
          fi

      - name: Run tests
        run: ./gradlew test

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

      - name: Publish to JetBrains Marketplace
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set +e
          ./gradlew publishPlugin 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 0 ]; then
            echo "Published to JetBrains Marketplace."
            exit 0
          fi
          # A re-run, or a tag pushed twice, must not fail the build just
          # because the version is already live.
          if grep -q "already contains version" /tmp/publish.log; then
            echo "::notice::This version is already published on the Marketplace; nothing to do."
            exit 0
          fi
          echo "::error::Publishing to JetBrains Marketplace failed."
          exit "${status}"
